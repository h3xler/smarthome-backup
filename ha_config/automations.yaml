- id: '1769900000001'
  alias: Su Arıtma Güvenlik Protokolü (Full Korumalı)
  description: Musluk, Tank ve Sızıntı durumlarına göre dinamik koruma.
  mode: restart
  triggers:
  - trigger: state
    entity_id: switch.mutfak_su_vanasi
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.mutfak_su_akisi
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.mutfak_su_akisi
    to: 'off'
  - trigger: state
    entity_id: binary_sensor.mutfak_su_sizinti_sensoru_water_leak
    to: 'on'
  actions:
  - delay: 00:00:02
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.mutfak_su_sizinti_sensoru_water_leak
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.mutfak_su_vanasi
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mutfakta_su_sizintisi_var
      - action: notify.mobile_app_sm_s901e
        data:
          message: "\U0001F6A8 ACİL DURUM: Mutfakta su sızıntısı algılandı! Vana kapatıldı."
          title: SU SIZINTISI!
          data:
            priority: high
            ttl: 0
            channel: alarm_stream
      - stop: Sızıntı tespit edildiği için sistem durduruldu.
    - conditions:
      - condition: state
        entity_id: switch.mutfak_su_vanasi
        state: 'on'
      - condition: state
        entity_id: binary_sensor.mutfak_su_akisi
        state: 'on'
      sequence:
      - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.mutfak_su_akisi
          to: 'off'
        timeout: 00:20:00
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.mutfak_su_akisi
          state: 'on'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.mutfak_su_vanasi
        - action: notify.mobile_app_sm_s901e
          data:
            message: ⚠️ Musluk 20 dakikadır açık unutuldu. Su kesildi.
            title: Su Güvenliği
    - conditions:
      - condition: state
        entity_id: switch.mutfak_su_vanasi
        state: 'on'
      - condition: state
        entity_id: binary_sensor.mutfak_su_akisi
        state: 'off'
      sequence:
      - delay: 02:30:00
      - action: switch.turn_off
        target:
          entity_id: switch.mutfak_su_vanasi
      - action: notify.mobile_app_sm_s901e
        data:
          message: "\U0001F6D1 Tank dolum süresi (2.5 saat) aşıldı."
          title: Su Güvenliği
