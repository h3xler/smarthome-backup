# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Veritabanı Kayıt Ayarları
recorder:
  # Verileri kaç gün saklayacağız? (Standart 10 gündür, 7 idealdir)
  purge_keep_days: 7
  # Diske yazma sıklığı (SSD ömrünü uzatır, performansı artırır)
  commit_interval: 30
  # Gereksiz verileri veritabanına HİÇ sokma
  exclude:
    domains:
      - media_player # Şarkı değişimi loglarına gerek yok
      - weblink
      - updater
    entity_globs:
      - sensor.*_lqi   # Sinyal kalitesi geçmişine gerek yok
      - sensor.*_linkquality
      - sensor.clock* # Saat sensörünü kaydetme
      - sensor.date*

# 👇 HTTP AYARLARI (EN BAŞA, EN SOLA YAZILMALI) 👇
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12  # Standart Docker Ağ Aralığı
    - 127.0.0.1      # Localhost

google_assistant:
  project_id: homeassistanto-15024
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true

mqtt:
  # ---------------------------------------------------------
  # BUTTONLAR (Mevcut Diafon Ayarların)
  # ---------------------------------------------------------
  button:
    - unique_id: "apartman_kapi_ac"
      name: "Apartman Kapısı"
      command_topic: "ev/diafon/komut"
      payload_press: "KAPI_AC"
      icon: "mdi:door"
      qos: 0
      retain: false

  # ---------------------------------------------------------
  # SWITCHLER (Vana + Diafon)
  # ---------------------------------------------------------
  switch:
    # 1. Mevcut Diafon
    - unique_id: "diafon_konusma_modu"
      name: "Diafon Konuşma Modu"
      command_topic: "ev/diafon/komut"
      payload_on: "KONUS_BASLA"
      payload_off: "KONUS_BITIR"
      state_topic: "ev/diafon/durum"
      icon: "mdi:microphone"

    # 2. YENİ: Mutfak Su Vanası (SCRIPT DESTEKLI MOD)
    - name: "Mutfak Su Vanası"
      unique_id: "shelly_mutfak_vana"
      
      # Komut Gönderme
      command_topic: "shelly-mutfak/rpc"
      # İpucu: "src" değerini değiştirmek şart değil ama log takibi için unique yapmak iyidir.
      payload_on: '{"id":1, "src":"ha-switch", "method":"Switch.Set", "params":{"id":0,"on":true}}'
      payload_off: '{"id":1, "src":"ha-switch", "method":"Switch.Set", "params":{"id":0,"on":false}}'
      
      # --- KRİTİK DEĞİŞİKLİK ---
      # Shelly Plus, durumu buraya JSON olarak basar:
      state_topic: "shelly-mutfak/status/switch:0"
      
      # Gelen JSON: {"id":0, "source":"switch", "output":true, "apower":0, ...}
      # output:true ise 'on', değilse 'off' yapıyoruz.
      value_template: "{{ 'on' if value_json.output == true else 'off' }}"
      
      state_on: "on"
      state_off: "off"
      
      optimistic: false
      qos: 1
      retain: false
      icon: "mdi:valve"

  # ---------------------------------------------------------
  # SENSÖRLER (Akış + Diafon)
  # ---------------------------------------------------------
  binary_sensor:
    # 1. Mevcut Diafon Zili
    - unique_id: "diafon_zil_caliyor"
      name: "Kapı Zili"
      state_topic: "ev/diafon/zil"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: sound
      icon: "mdi:bell-ring"

    # 2. YENİ: Mutfak Su Akışı (GÜNCELLENDİ)
    - name: "Mutfak Su Akışı"
      unique_id: "mqtt_flow_sensor_mutfak"
      state_topic: "shelly-mutfak/events/flow"
      payload_on: "ON"
      payload_off: "OFF"
      # --- EKLENEN KRİTİK BÖLÜM ---
      availability_topic: "shelly-mutfak/online"
      payload_available: "true"
      payload_not_available: "false"
      # ----------------------------
      device_class: moving
      icon: "mdi:water-pump"