version: '3.8'

services:
  # --- Home Assistant ---
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    privileged: true
    network_mode: host 
    # Not: Oracle'da host modu bazen sorun çıkarabilir. 
    # Eğer erişemezseniz network_mode satırını silip yerine şunu açın:
    # ports:
    #   - "8123:8123"

  # --- MQTT Broker (Mosquitto) ---
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # --- Zigbee2MQTT ---
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=Europe/Istanbul
    depends_on:
      - mosquitto

  # --- WireGuard VPN & UI ---
  wg-easy:
    environment:
      # ⚠️ BURAYA ORACLE SUNUCUNUZUN PUBLIC IP ADRESİNİ YAZIN
      - WG_HOST=130.61.239.38
      # ⚠️ Arayüz şifresi belirleyin
      - PASSWORD=o989898O**
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_MTU=1420
      - WG_AllowedIPs=10.8.0.0/24
      - WG_PERSISTENT_KEEPALIVE=25
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    volumes:
      - ./wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp" # VPN Tüneli
      - "51821:51821/tcp" # Yönetim Paneli
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
